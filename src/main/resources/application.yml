spring:
  application:
    name: enterprise-rag-document-assistant
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/enterprise_rag}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      connection-timeout: 5000
  ai:
    model:
      chat: ${AI_PROVIDER:openai}
      embedding: ${AI_EMBEDDING_PROVIDER:none}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
          dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2}
    vectorstore:
      pgvector:
        dimensions: ${PGVECTOR_DIMENSIONS:1536}
        distance-type: COSINE_DISTANCE
        initialize-schema: ${PGVECTOR_INITIALIZE_SCHEMA:false}
